onboarding = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+b"
new_worktree = ""
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+x"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "local.sibling-worktree.open"
description = "create sibling Git worktree"
